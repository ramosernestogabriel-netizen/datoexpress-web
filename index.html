<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dato Express — Un dato que no sabías, todos los días</title>
<meta name="description" content="Curiosidades y datos sorprendentes en videos de 30 segundos. Un dato nuevo todos los días.">
<meta property="og:title" content="Dato Express">
<meta property="og:description" content="Un dato que no sabías, todos los días.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b10;--card:#15151d;--line:#262633;--yel:#ffd400;--txt:#fff;--mut:#a9a9b8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(600px 400px at 80% -5%,rgba(255,212,0,.13),transparent 70%),
               radial-gradient(500px 400px at 0% 100%,rgba(255,90,40,.08),transparent 70%)}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;position:relative}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.3px;text-decoration:none}
  .logo svg{width:22px;height:30px}
  .logo span{color:var(--yel)}
  .pill{font-size:13px;font-weight:700;color:var(--bg);background:var(--yel);padding:7px 14px;border-radius:99px}
  .hero{padding:48px 0 36px}
  .hero h1{font-size:clamp(34px,6vw,60px);line-height:1.05;margin:0 0 14px;font-weight:800}
  .hero h1 em{font-style:normal;color:var(--yel)}
  .hero p{color:var(--mut);font-size:clamp(16px,2.2vw,19px);margin:0;max-width:560px}
  .bar{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 16px;border-top:1px solid var(--line);padding-top:22px}
  .bar h2{margin:0;font-size:20px}
  .bar small{color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding-bottom:60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;
        transition:transform .2s ease,border-color .2s ease;text-align:left;color:inherit;font:inherit;padding:0}
  .card:hover{transform:translateY(-3px);border-color:#3a3a4a}
  .card:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
  .thumb{position:relative;aspect-ratio:9/16;background:#000}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .play{position:absolute;inset:0;display:grid;place-items:end end;padding:12px}
  .play i{width:48px;height:48px;border-radius:50%;background:rgba(255,212,0,.95);display:grid;place-items:center;
          box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .play i::after{content:"";border-left:18px solid var(--bg);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
  .new{position:absolute;top:10px;left:10px;background:var(--yel);color:var(--bg);font-weight:800;font-size:11px;padding:4px 9px;border-radius:99px}
  .meta{padding:12px 14px 16px}
  .meta .tag{font-size:12px;color:var(--yel);font-weight:700}
  .meta h3{font-size:15px;line-height:1.3;margin:4px 0 6px}
  .meta time{font-size:12px;color:var(--mut)}
  .empty{color:var(--mut);padding:40px 0}
  dialog{border:0;padding:12px 12px 16px;background:var(--bg);border-radius:22px;max-width:min(420px,92vw);width:100%;overflow:visible}
  dialog::backdrop{background:rgba(0,0,0,.9)}
  dialog video{width:100%;max-height:74vh;border-radius:18px;background:#000;display:block}
  dialog .info{color:#fff;padding:12px 4px 0}
  dialog .info h3{margin:0 0 4px;font-size:17px}
  dialog .info p{margin:0;color:var(--mut);font-size:14px}
  .close{position:absolute;top:-46px;right:0;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;line-height:1}
  @media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:12px}.meta h3{font-size:13px}.play i{width:38px;height:38px}}
  footer{color:var(--mut);font-size:13px;border-top:1px solid var(--line);padding:22px 0 40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">
      <svg viewBox="0 0 22 30" aria-hidden="true"><polygon fill="#ffd400" points="13,0 0,17 9,17 6,30 20,11 11,11 16,0"/></svg>
      DATO <span>EXPRESS</span>
    </a>
    <span class="pill">Un dato por día</span>
  </header>

  <section class="hero">
    <h1>Un dato que <em>no sabías</em>,<br>todos los días.</h1>
    <p>Curiosidades sorprendentes contadas en menos de 30 segundos.</p>
  </section>

  <div class="bar">
    <h2>Últimos videos</h2>
    <small id="count"></small>
  </div>
  <div class="grid" id="grid"><p class="empty">Cargando…</p></div>

  <footer>© <span id="y"></span> Dato Express</footer>
</div>

<dialog id="player">
  <button class="close" aria-label="Cerrar" onclick="closePlayer()">×</button>
  <video id="pv" controls playsinline></video>
  <div class="info"><h3 id="pt"></h3><p id="pd"></p></div>
</dialog>

<script>
  document.getElementById("y").textContent = new Date().getFullYear();
  const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let videos = [];

  fetch("videos.json", { cache: "no-store" })
    .then(r => r.json())
    .then(list => {
      videos = list.sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id.localeCompare(a.id));
      document.getElementById("count").textContent = videos.length + (videos.length === 1 ? " video" : " videos");
      document.getElementById("grid").innerHTML = videos.length ? videos.map((v, i) => `
        <button class="card" onclick="openPlayer(${i})">
          <div class="thumb">
            <img src="${esc(v.miniatura)}" alt="" loading="lazy">
            <div class="play"><i></i></div>
            ${i === 0 ? '<span class="new">NUEVO</span>' : ""}
          </div>
          <div class="meta">
            <div class="tag">${esc(v.tema)}</div>
            <h3>${esc(v.titulo)}</h3>
            <time datetime="${esc(v.fecha)}">${fmt(v.fecha)}</time>
          </div>
        </button>`).join("") : '<p class="empty">Pronto el primer video.</p>';
    })
    .catch(() => { document.getElementById("grid").innerHTML = '<p class="empty">No se pudieron cargar los videos.</p>'; });

  const dlg = document.getElementById("player"), pv = document.getElementById("pv");
  function openPlayer(i) {
    const v = videos[i];
    pv.src = v.video; pv.poster = v.miniatura;
    document.getElementById("pt").textContent = v.titulo;
    document.getElementById("pd").textContent = v.descripcion || "";
    dlg.showModal(); pv.play().catch(() => {});
  }
  function closePlayer() { pv.pause(); dlg.close(); }
  dlg.addEventListener("close", () => pv.pause());
  dlg.addEventListener("click", e => { if (e.target === dlg) closePlayer(); });
</script>
</body>
</html>
